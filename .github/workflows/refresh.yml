name: Refresh multiplex data

on:
  schedule:
    - cron: "0 11 * * *"  # ~06:00-07:00 America/Toronto, daily
  workflow_dispatch: {}
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch permits (cleared + active)
        working-directory: ingest
        run: python fetch_permits.py

      - name: Fetch reference data (address points + wards)
        working-directory: ingest
        run: python fetch_reference.py

      - name: Classify new permits with Claude
        working-directory: classify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python classify_permits.py

      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: Export GeoJSON for the map
        working-directory: export
        run: python export_geojson.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data site/sitemap.xml dbt/seeds/llm_permit_scope.csv
          git diff --cached --quiet || git commit -m "Refresh multiplex permit data"
          git push

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
